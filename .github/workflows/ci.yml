name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Database access rules
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/auth_stub.sql
          $P -f supabase/schema.sql
          $P -f supabase/tests/rls_test.sql | tee rls.log
          grep -q "ALL RLS CHECKS PASSED" rls.log
      - name: End-to-end walkthrough (demo mode)
        run: |
          npx playwright install --with-deps chromium
          VITE_DEMO=1 npm run build
          (npx vite preview --port 4173 --strictPort &) && sleep 3
          node e2e/demo-flow.mjs http://localhost:4173/
